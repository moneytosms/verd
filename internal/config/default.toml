# verd config. Every key is optional; uncomment to override the default shown.
# Print the effective (merged) config with `verd config`.

# Your Codeforces handle. Required.
# handle = "tourist"

# Where Solutions and test files live: <workspace>/<contest>/<index>/
# workspace = "~/verd"

# Language used for new Solutions: cpp | c | python (or any [lang.*] key).
# default_lang = "cpp"

# Scales every Problem's time limit for local runs (slow machine: 2.0).
# time_multiplier = 1.0

# Absolute/relative tolerance for the float Comparison Mode.
# float_eps = 1e-6

# Run tests automatically whenever you save the Solution.
# autotest = true

# Color theme: terminal (inherits your terminal palette) | tokyo-night | dracula | catppuccin |
# gruvbox | nord | one-dark | solarized. Change it live in the Settings tab (5).
# theme = "terminal"

# Light or dark palette: auto (detect the terminal background) | dark | light
# background = "auto"

# Which problem sources the list, search and picker show. CSES (cses.fi) is off by default;
# load it with ctrl+r after turning it on. Mark CSES tasks solved with m, or `verd sync cses`.
# source_cf = true
# source_cses = false

# The editor command: nvim (default), vim, hx, nano, micro, emacs, kak, code, subl, zed, or any
# other; extra arguments are allowed ("code -w"). Neovim also reuses its pane on the next `e`.
# editor = "nvim"

# How the editor opens: auto | tmux | herdr | embedded | suspend
# split = "auto"
#   embedded draws Neovim inside verd (opt-in, works outside tmux/herdr). Keys go to Neovim
#   while it has focus; embed_focus_key hands them back to verd. Kitty-keyboard-only chords
#   (e.g. ctrl+shift combinations) are not encoded.

# Share of the window verd keeps when Neovim is embedded.
# embed_ratio = 0.4

# Which side the embedded Neovim is on: right | left
# embed_side = "right"
# Keys: alt+h / alt+l move the keyboard to the left / right column, embed_focus_key toggles,
# alt+z hides verd (Neovim fullscreen) and brings it back.

# Toggles keyboard focus between verd and the embedded Neovim.
# embed_focus_key = "ctrl+\\"

# How `s` / `verd submit` sends a Solution: browser | direct
# browser copies the Solution, opens the submit page and tracks the Verdict (default, safe).
# direct posts it from verd using the browser session saved by `verd login`. EXPERIMENTAL:
# it replays your Codeforces cookies, which Codeforces may treat as automation (account risk),
# and it falls back to browser on any failure.
# submit_mode = "browser"

# Keyboard shortcuts. Every shortcut is rebindable: Settings (5) > Keyboard shortcuts edits these
# for you, or write them by hand as [keys.<context>] action = "key" (or a list of keys).
# Contexts: common, tabs, app, problems, contests, contest, stats, picker, settings, problem,
# testmgr, submission, help, editor. Key names: x, X, enter, esc, tab, space, up, down, pgup,
# pgdown, home, end, backspace, ctrl+x, alt+x, shift+tab. ctrl+c always quits.
# A rebound action stops answering to its old key; two actions on one key is an error.
# [keys.problem]
# run_tests = "ctrl+t"
# submit = ["s", "ctrl+s"]
# [keys.editor]
# focus_left = "alt+h"
# focus_right = "alt+l"
# zoom = "alt+z"

# Reading preferences: how statements are laid out and styled.
# reading_width = 0
#   Max width for statement text in columns (0 = use the whole pane; 40-200 to cap it).
#   Text is left-aligned inside the pane at the given width.
# reading_margin = 1
#   Left margin in columns (0-8).
# reading_spacing = "normal"
#   Blank lines between paragraphs: compact | normal | relaxed
# reading_headings = "bar"
#   Section heading style: plain | bold | bar | underline
# reading_math = "unicode"
#   Math rendering: unicode (TeX->Unicode) | raw (TeX source)
# reading_emphasis = true
#   Render italics and bold; false = plain text for emphasis.

# Languages mirror the Codeforces compilers. Placeholders: {src} {bin} {dir}.
# Omit `compile` for interpreted languages. Override only the keys you change.
# [lang.cpp]
# ext = "cpp"
# compile = ["g++", "-std=c++20", "-O2", "-Wall", "-o", "{bin}", "{src}"]
# run = ["{bin}"]
# cf_compiler_id = 89
