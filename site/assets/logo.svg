<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="verd">
  <defs>
    <linearGradient id="g" x1="8" y1="50" x2="56" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ece6a"/><stop offset=".55" stop-color="#73daca"/><stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2335"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <style>
      .tick{stroke-dasharray:84;stroke-dashoffset:84;animation:draw .9s cubic-bezier(.65,0,.35,1) .15s forwards}
      .halo{opacity:0;stroke-dasharray:84;stroke-dashoffset:84;animation:draw .9s cubic-bezier(.65,0,.35,1) .15s forwards,glow 3.2s ease-in-out 1.1s infinite}
      .cur{opacity:0;animation:pop .3s ease 1s forwards,blink 1.1s steps(1) 1.4s infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
      @keyframes pop{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.tick,.halo{animation:none;stroke-dashoffset:0}.halo{opacity:.35}.cur{animation:none;opacity:1}}
    </style>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#2f3550" stroke-width="1.5"/>
  <path class="halo" d="M14 33 L27 46 L51 17" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path class="tick" d="M14 33 L27 46 L51 17" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cur" x="13" y="50" width="14" height="4.5" rx="2.25" fill="#9ece6a"/>
</svg>
