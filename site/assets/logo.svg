<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="verd: a gavel strikes, the verdict is AC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1f2335"/><stop offset="1" stop-color="#14141b"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0caf5"/><stop offset=".55" stop-color="#8f9cd8"/><stop offset="1" stop-color="#5a6aa8"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c58a3a"/><stop offset=".5" stop-color="#e0af68"/><stop offset="1" stop-color="#b57a2e"/></linearGradient>
    <linearGradient id="ok" x1="14" y1="100" x2="112" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9ece6a"/><stop offset=".6" stop-color="#73daca"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
      .gavel{transform-origin:64px 20px;transform-box:view-box}
      .block{transform-box:fill-box;transform-origin:center bottom}
      .ring{fill:none;stroke:#9ece6a;stroke-width:3;opacity:0;transform-origin:64px 100px}
      .sp{opacity:0;stroke-dasharray:14;stroke-dashoffset:14}

      .gavel{animation:slam 2.6s cubic-bezier(.5,0,.2,1) both}
      .block{animation:squash 2.6s ease both}
      .ring{animation:ring 2.6s ease-out both}
      .sp{animation:spark 2.6s ease-out both}
      .badge{transform-box:fill-box;transform-origin:center;animation:pop 2.6s cubic-bezier(.3,1.5,.5,1) both}
      #all{animation:shake 2.6s linear both}
      @keyframes slam{0%{opacity:0;transform:rotate(28deg)}8%{opacity:1;transform:rotate(28deg)}24%{transform:rotate(36deg)}34%{transform:rotate(0)}40%{transform:rotate(7deg)}46%,100%{transform:rotate(0)}}
      @keyframes squash{0%,32%{transform:scaleY(1)}35%{transform:scaleY(.82)}44%,100%{transform:scaleY(1)}}
      @keyframes ring{0%,33%{opacity:0;transform:scale(.2)}35%{opacity:.9}60%,100%{opacity:0;transform:scale(2.6)}}
      @keyframes spark{0%,33%{opacity:0;stroke-dashoffset:14}36%{opacity:1;stroke-dashoffset:0}60%,100%{opacity:0;stroke-dashoffset:-14}}
      @keyframes pop{0%,44%{opacity:0;transform:scale(.2)}58%,100%{opacity:1;transform:scale(1)}}
      @keyframes shake{0%,33%{transform:none}35%{transform:translate(0,2px)}38%{transform:translate(-1px,-1px)}42%,100%{transform:none}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.gavel,.badge{opacity:1}}
  </style>
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#bg)"/>
  <rect x="3.75" y="3.75" width="120.5" height="120.5" rx="27.25" fill="none" stroke="#2f3550" stroke-width="1.5"/>
  <g id="all">
  <circle class="ring" cx="64" cy="100" r="14"/>
  <g class="block"><path d="M24 101h80a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5H24a5 5 0 0 1-5-5v-5a5 5 0 0 1 5-5z" fill="#252a42" stroke="#414868" stroke-width="1.5"/><rect x="24" y="102.5" width="80" height="2" rx="1" fill="#5a6aa8" opacity=".55"/></g>
  <g class="gavel"><rect x="59.5" y="20" width="9" height="58" rx="4.5" fill="url(#wood)"/><rect x="59.5" y="26" width="9" height="3" fill="#7a4f1c" opacity=".55"/><rect x="59.5" y="33" width="9" height="3" fill="#7a4f1c" opacity=".55"/>
    <rect x="37" y="72" width="54" height="29" rx="7" fill="url(#steel)" stroke="#e8ecff" stroke-opacity=".35" stroke-width="1"/>
    <rect x="37" y="72" width="11" height="29" rx="5" fill="#7aa2f7" opacity=".55"/><rect x="80" y="72" width="11" height="29" rx="5" fill="#7aa2f7" opacity=".55"/>
    <path d="M58 81h12m-12 6h12m-12 6h12" stroke="#3b4261" stroke-width="2.2" stroke-linecap="round" opacity=".7"/></g>
  <path class="sp s0" d="M64 99 L30 80" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/><path class="sp s1" d="M64 99 L40 66" stroke="#e0af68" stroke-width="3" stroke-linecap="round"/><path class="sp s2" d="M64 99 L98 80" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/><path class="sp s3" d="M64 99 L88 66" stroke="#e0af68" stroke-width="3" stroke-linecap="round"/><path class="sp s4" d="M64 99 L22 96" stroke="#73daca" stroke-width="3" stroke-linecap="round"/><path class="sp s5" d="M64 99 L106 96" stroke="#73daca" stroke-width="3" stroke-linecap="round"/>
  <g class="badge"><circle cx="99" cy="33" r="17" fill="url(#ok)"/><path d="M90 33.5l6.5 6.5L109 26" fill="none" stroke="#14141b" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
